<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZTMYクイズ</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: black;
  color: #b84cff;
  font-family: monospace;
  text-align: center;
  min-height: 100vh;
  overflow-x: hidden;
}

/* タイトル */
h1 {
  font-size: 28px;
}

/* 問題 */
#question {
  font-size: 20px;
  margin: 20px 0;
}

/* ボタン */
button {
  display: block;
  width: 90%;
  max-width: 400px;
  margin: 10px auto;
  padding: 15px;
  font-size: 18px;
  background: #111;
  color: #b84cff;
  border: 1px solid #b84cff;
  border-radius: 10px;
}

button:active {
  transform: scale(0.95);
  background: #b84cff;
  color: black;
}

/* 入力 */
input {
  width: 80%;
  max-width: 300px;
  padding: 12px;
  font-size: 16px;
  background: #111;
  border: 1px solid #b84cff;
  color: #b84cff;
  border-radius: 8px;
}

/* アイコン */
#icon-select img {
  width: 60px;
  margin: 5px;
}

/* スマホ */
@media (max-width: 600px) {
  h1 { font-size: 24px; }
  #question { font-size: 18px; }
  button { font-size: 16px; padding: 12px; }
}

#hell-btn{
  animation: flash 1s infinite;
  border-color: red;
  color: red;
  box-shadow: 0 0 20px red;
}

@keyframes flash{
  0%{opacity:1;}
  50%{opacity:0.3;}
  100%{opacity:1;}
}

.correct{
  animation: glow 0.5s;
}

@keyframes glow{
  0%{transform:scale(1);}
  50%{transform:scale(1.03);}
  100%{transform:scale(1);}
}
</style>
</head>

<body>

<div id="start-area">
  <h1 id="title">ZTMYクイズ</h1>
  <button onclick="start('easy')">Easy</button>
  <button onclick="start('normal')">Normal</button>
  <button onclick="start('hard')">Hard</button>

  <button id="hell-btn"
  onclick="start('hell')"
  style="display:none;">
  Hell
  </button>
</div>

<div id="quiz-area" style="display:none;">
  <p id="question"></p>
  <button onclick="answer(0)" id="a0"></button>
  <button onclick="answer(1)" id="a1"></button>
  <button onclick="answer(2)" id="a2"></button>
  <button onclick="answer(3)" id="a3"></button>
</div>

<div id="result-area" style="display:none;">
  <h1 id="result-text"></h1>
  <button onclick="next()">次へ</button>
</div>

<div id="name-area" style="display:none;">
  <h2>名前とアイコン選択</h2>
  <input id="nameInput" placeholder="名前">

  <h3>アイコン</h3>
  <div id="icon-select"></div>

  <button onclick="submitName()">送信</button>
  <p id="error" style="color:red;"></p>
</div>
<div id="ranking-area" style="display:none;">
  <h1 id="ranking-title">RANKING</h1>

  <div id="ranking-list"></div>

  <button onclick="location.reload()">
    もう一回
  </button>
</div>

<script type="module">

import { quizData } from "./questions.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAJBiQAmfuoNOtF4TOhqCPYRywOASvL52Y",
  authDomain: "ztmy-quiz.firebaseapp.com",
  projectId: "ztmy-quiz",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===== アイコン ===== */
const iconList = [
  "images/icon1.png",
  "images/icon2.png",
  "images/icon3.png",
  "images/icon4.png"
];

let selectedIcon = "";

let admin = false;
const adminPassword = atob("YXl1bXU="); /*password*/
  
function loadIcons(){
  let area = document.getElementById("icon-select");
  area.innerHTML = "";

  iconList.forEach(icon=>{
    let img = document.createElement("img");
    img.src = icon;

    img.onclick = () => {
      selectedIcon = icon;
      document.querySelectorAll("#icon-select img")
        .forEach(i=>i.style.border="none");
      img.style.border="2px solid #b84cff";
    };

    area.appendChild(img);
  });
}

/* ===== クイズ ===== */
let quiz=[], i=0, score=0, mode="easy";

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

window.start=function(m){
  mode=m;

  document.getElementById("start-area").style.display="none";
  document.getElementById("quiz-area").style.display="block";

  let pool=[...quizData[m]];
  shuffle(pool);

  quiz = pool.slice(0,10); // ランダム10問

  i=0;
  score=0;
  load();
}

function load(){

  document.getElementById("question").innerText =
  `Q${i+1}/10\n${quiz[i].q}`;

  for(let j=0;j<4;j++){
    document.getElementById("a"+j).innerText =
    quiz[i].a[j];
  }
}

window.answer=function(n){
  document.getElementById("quiz-area").style.display="none";
  document.getElementById("result-area").style.display="block";

  if(n===quiz[i].correct){
    score++;
    document.body.classList.add("correct");

    setTimeout(()=>{
      document.body.classList.remove("correct");
    },500);
    document.body.style.background="#2a003f";
    document.getElementById("result-text").innerText="正解！🔥";
  }else{
    document.body.style.background="#3f0000";
    document.getElementById("result-text").innerText=
      "不正解… 正解は「"+quiz[i].a[quiz[i].correct]+"」";
  }
}

window.next=function(){
  i++;
  if(i<quiz.length){
    document.body.style.background="black";
    document.getElementById("quiz-area").style.display="block";
    document.getElementById("result-area").style.display="none";
    load();
  }else{
    finish();
  }
}

function finish(){
  document.getElementById("result-area").style.display="none";
  document.getElementById("name-area").style.display="block";
  loadIcons();
}

/* ===== 保存 ===== */
window.submitName = async function(){

  let name = document.getElementById("nameInput").value.trim();
  let error = document.getElementById("error");

  const ngWords = [
    "死ね",
    "暴言",
    "NG"
  ];

  for(let w of ngWords){

    if(name.includes(w)){

      error.innerText="その名前は禁止";
      return;
    }
  }

  if(!name || !selectedIcon){
    error.innerText="入力＆選択して";
    return;
  }

  if(name.length > 10){

    error.innerText="10文字以内";
    return;
  }

  let percent = Math.round((score/quiz.length)*100);
  if(percent === 100){
  localStorage.setItem(mode+"_clear","true");
  }

  const col = collection(db,"ranking_"+mode);
  const snap = await getDocs(col);

  let found=null;

  snap.forEach(d=>{
    if(d.data().name===name) found=d;
  });

  if(found){
    if(percent > found.data().score){
      await updateDoc(doc(db,"ranking_"+mode,found.id),{
        score:percent,
        icon:selectedIcon
      });
    }
  }else{
    await addDoc(col,{
      name:name,
      score:percent,
      icon:selectedIcon
    });
  }
  checkHell();
  showRanking();
}

window.showAllRankings = async function(){

  document.getElementById("start-area")
    .style.display="none";

  document.getElementById("ranking-area")
    .style.display="block";

  document.getElementById("ranking-title")
    .innerText = "ALL RANKINGS";

  document.getElementById("ranking-list")
    .innerHTML = "Loading...";

  const modes = ["easy","normal","hard","hell"];

  let html = "";

  for(let m of modes){

    const q = query(
      collection(db,"ranking_"+m),
      orderBy("score","desc"),
      limit(10)
    );

    const snap = await getDocs(q);

    html += `
      <h2 style="
        color:#ff4fd8;
        margin-top:30px;
      ">
        ${m.toUpperCase()}
      </h2>
    `;

    let rank = 1;

    snap.forEach(doc=>{

      let d = doc.data();

      html += `
        <div style="
          margin:10px;
          padding:10px;
          border:1px solid #b84cff;
          border-radius:10px;
        ">

          <img src="${d.icon}"
          width="40"
          style="
            border-radius:50%;
            vertical-align:middle;
          ">

          ${rank}位 :
          ${d.name}
          - ${d.score}%

          <button onclick="
            deleteRankMode(
              '${m}',
              '${doc.id}'
            )
          ">
            削除
          </button>

        </div>
      `;

      rank++;
    });
  }

  document.getElementById("ranking-list")
    .innerHTML = html;
}

/* ===== ランキング ===== */
async function showRanking(){
  document.getElementById("ranking-title")
  .innerText =
  mode.toUpperCase() + " ランキング";

  document.getElementById("name-area").style.display="none";
  document.getElementById("ranking-area").style.display="block";

  document.getElementById("ranking-list")
    .innerHTML = "Loading...";

  const q=query(
    collection(db,"ranking_"+mode),
    orderBy("score","desc"),
    limit(100)
  );

  const snap=await getDocs(q);

  let html="";
  let rank=1;

  snap.forEach(doc=>{

    let d=doc.data();

    let style="";
    let title="";

    if(d.score === 100){
      title="👑 神";
    }else if(d.score >= 80){
      title="🔥 ガチ勢";
    }else if(d.score >= 50){
      title="✨ ファン";
    }else{
      title="🙂 にわか";
    }

    if(rank===1){
      style="color:gold;font-size:24px;";
    }

    if(rank===2){
      style="color:silver;";
    }

    if(rank===3){
      style="color:#cd7f32;";
    }
    let deleteButton = "";

    if(admin){

      deleteButton = `
        <button onclick="deleteRank('${doc.id}')">
          削除
        </button>
      `;
    }

    html += `
      <div style="
        ${style}
        margin:10px;
        padding:10px;
        border:1px solid #b84cff;
        border-radius:10px;
      ">

        <img src="${d.icon}"
        width="40"
        style="border-radius:50%;vertical-align:middle;">

        ${rank}位 :
        ${d.name}
        - ${d.score}%
        ${title}
        ${deleteButton}

      </div>
    `;

    rank++;
  });

  document.getElementById("ranking-list").innerHTML = html;
}
  
function checkHell(){

  const easy =
    localStorage.getItem("easy_clear");

  const normal =
    localStorage.getItem("normal_clear");

  const hard =
    localStorage.getItem("hard_clear");

  if(easy && normal && hard){

    document.getElementById("hell-btn")
      .style.display="block";

  if(easy && normal && hard){

    document.getElementById("hell-btn")
      .style.display="block";

    if(!localStorage.getItem("hell_notice")){

      alert("HELL MODE UNLOCK");

      localStorage.setItem(
        "hell_notice",
        "true"
      );
    }
  }
  }
}

checkHell();

let tapCount = 0;

const title = document.getElementById("title");

title.addEventListener("click", ()=>{

  tapCount++;

  if(tapCount >= 10){

    tapCount = 0;

    adminLogin();
  }

  setTimeout(()=>{
    tapCount = 0;
  },5000);

});

window.deleteRankMode = async function(modeName,id){

  let ok = confirm("削除する？");

  if(!ok) return;

  await deleteDoc(
    doc(db,"ranking_"+modeName,id)
  );

  showAllRankings();
}

window.adminLogin = function(){

  let pass = prompt("PASSWORD");

  if(pass === adminPassword){

    admin = true;

    alert("SYSTEM ACCESS");

    showAllRankings();

  }else{

    alert("ACCESS DENIED");
  }
}
</script>

</body>
</html>
